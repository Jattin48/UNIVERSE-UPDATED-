<div class="profile-container" *ngIf="profile">
  <div class="profile-card">
    <div class="card-header">
      <h2>🎓 My Student Profile</h2>
      <p>Build your academic marks, stream, & college preferences to get personalized suggestions</p>
    </div>

    <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>

    <form (ngSubmit)="onSave()" class="profile-form">
      <!-- Personal Details -->
      <section class="form-section">
        <h3>Basic Information</h3>
        <div class="form-grid-2">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" [(ngModel)]="profile.name" name="name" required />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" [(ngModel)]="profile.phone" name="phone" />
          </div>
        </div>
      </section>

      <!-- Class 12 Marks & Stream -->
      <section class="form-section">
        <h3>Class 12th Academic Background</h3>
        <div class="form-grid-2">
          <div class="form-group">
            <label>Board</label>
            <select [(ngModel)]="profile.class12.board" name="board">
              <option value="CBSE">CBSE</option>
              <option value="ICSE">ICSE / ISC</option>
              <option value="State Board">State Board</option>
              <option value="IB / Other">IB / Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Stream *</label>
            <select [(ngModel)]="profile.class12.stream" name="stream">
              <option value="Science">Science (PCM / PCB)</option>
              <option value="Commerce">Commerce</option>
              <option value="Arts">Arts / Humanities</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Class 12 Percentage (%) *</label>
            <input
              type="number"
              step="0.1"
              min="0"
              max="100"
              [(ngModel)]="profile.class12.percentage"
              name="percentage"
              placeholder="e.g. 92.5"
            />
          </div>

          <div class="form-group">
            <label>Year of Passing</label>
            <input
              type="number"
              [(ngModel)]="profile.class12.yearOfPassing"
              name="yearOfPassing"
              placeholder="e.g. 2025"
            />
          </div>
        </div>

        <div class="form-group mt-3">
          <label>Subjects Studied (comma-separated)</label>
          <input
            type="text"
            [(ngModel)]="subjectsInput"
            name="subjectsInput"
            placeholder="Physics, Chemistry, Mathematics, English, Computer Science"
          />
        </div>
      </section>

      <!-- Preferences -->
      <section class="form-section">
        <h3>College Discovery Preferences</h3>

        <div class="form-group">
          <label>Interested Courses (comma-separated)</label>
          <input
            type="text"
            [(ngModel)]="coursesInput"
            name="coursesInput"
            placeholder="e.g. B.Tech Computer Science, BBA, B.Com (Hons)"
          />
        </div>

        <div class="form-group mt-3">
          <label>Preferred Cities / States (comma-separated)</label>
          <input
            type="text"
            [(ngModel)]="locationsInput"
            name="locationsInput"
            placeholder="e.g. Delhi, Bengaluru, Pune, Mumbai"
          />
        </div>

        <div class="form-grid-2 mt-3">
          <div class="form-group">
            <label>Annual Budget Minimum (₹)</label>
            <input
              type="number"
              [(ngModel)]="profile.preferences.budgetMin"
              name="budgetMin"
              placeholder="0"
            />
          </div>
          <div class="form-group">
            <label>Annual Budget Maximum (₹)</label>
            <input
              type="number"
              [(ngModel)]="profile.preferences.budgetMax"
              name="budgetMax"
              placeholder="500000"
            />
          </div>
        </div>
      </section>

      <button type="submit" [disabled]="isSaving" class="btn-save">
        <span *ngIf="!isSaving">Save Profile Settings</span>
        <span *ngIf="isSaving">Saving...</span>
      </button>
    </form>
  </div>
</div>

<div *ngIf="isLoading" class="loading-state">
  <p>Loading profile...</p>
</div>
