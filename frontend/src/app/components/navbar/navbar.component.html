<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="brand">
      <span class="brand-universe">UNIVERSE</span>
      <span class="brand-tag">College Discovery</span>
    </a>

    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
      <span class="hamburger-bar" [class.open]="isMobileMenuOpen"></span>
      <span class="hamburger-bar" [class.open]="isMobileMenuOpen"></span>
      <span class="hamburger-bar" [class.open]="isMobileMenuOpen"></span>
    </button>

    <div class="nav-links" [class.open]="isMobileMenuOpen">
      <a routerLink="/colleges" routerLinkActive="active" (click)="closeMobileMenu()">Explore Colleges</a>

      <ng-container *ngIf="authService.isStudent()">
        <a routerLink="/student/profile" routerLinkActive="active" (click)="closeMobileMenu()">My Profile</a>
        <a routerLink="/student/shortlist" routerLinkActive="active" (click)="closeMobileMenu()">Shortlisted</a>
      </ng-container>

      <ng-container *ngIf="authService.isCollege()">
        <a routerLink="/college/dashboard" routerLinkActive="active" (click)="closeMobileMenu()">College Dashboard</a>
      </ng-container>

      <ng-container *ngIf="authService.isAdmin()">
        <a routerLink="/admin/panel" routerLinkActive="active" (click)="closeMobileMenu()">Admin Panel</a>
      </ng-container>

      <ng-container *ngIf="!authService.isLoggedIn(); else userMenu">
        <a routerLink="/login" class="btn-secondary" (click)="closeMobileMenu()">Login</a>
        <a routerLink="/signup" class="btn-primary" (click)="closeMobileMenu()">Sign Up</a>
      </ng-container>

      <ng-template #userMenu>
        <div class="user-badge">
          <span class="role-chip" [ngClass]="authService.getUserRole() || ''">
            {{ authService.getUserRole() | uppercase }}
          </span>
          <span class="user-email">{{ authService.currentUser()?.email }}</span>
          <button (click)="onLogout()" class="btn-outline">Logout</button>
        </div>
      </ng-template>
    </div>
  </div>
</nav>
